schema_version: "1.0"

benchmark:
  spec_id: operator.accuracy_validation
  spec_version: "1.1.0"
  case_schema_version: "1"
  display_name: Operator Accuracy Validation

case:
  dimensions:
    - name: operator
      type: string
      min_length: 1
      max_length: 128
    - name: dtype
      type: string
      enum: [f16, f32]
  metrics:
    - name: passed
      unit: ratio
      direction: higher_is_better
      required: true

summary_metrics:
  - name: accuracy_total_cases
    unit: count
    direction: neutral
    required: true
  - name: accuracy_passed_cases
    unit: count
    direction: higher_is_better
    required: true
  - name: accuracy_failed_cases
    unit: count
    direction: lower_is_better
    required: true
  - name: accuracy_pass_rate
    unit: ratio
    direction: higher_is_better
    required: true
